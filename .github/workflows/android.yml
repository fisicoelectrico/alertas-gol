# Compila el APK de ADN Soccer (TWA + widget) en los servidores de GitHub (traen el SDK de Android)
# y lo publica como Release, con un enlace fijo para descargarlo desde el celular:
#   https://github.com/fisicoelectrico/alertas-gol/releases/latest/download/adn-soccer.apk
# (el nombre viejo alertas-gol-widget.apk se sigue publicando para no romper enlaces anteriores)
name: APK de ADN Soccer
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Compilar APK firmado
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk adn-soccer.apk
          cp adn-soccer.apk alertas-gol-widget.apk
          gh release create "app-${{ github.run_number }}" adn-soccer.apk alertas-gol-widget.apk \
            --target "${{ github.sha }}" --latest \
            --title "ADN Soccer 2.${{ github.run_number }}" \
            --notes "App de Android (TWA + widget), rama ${{ github.ref_name }}. Las notificaciones salen a nombre de ADN Soccer. Instalar: abrir el enlace desde el celular y permitir la instalación."
