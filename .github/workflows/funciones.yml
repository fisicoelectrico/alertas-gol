# Despliega las Edge Functions (escaner, api, sonda-flashscore) en Supabase cada vez que cambian en main.
# Poka-yoke del despliegue: ningún cambio del escáner queda escrito en el repo pero sin activar.
# Requiere el secreto SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens), pegado una vez en
# GitHub → Settings → Secrets and variables → Actions. Sin el secreto, el trabajo avisa y no hace nada.
# Las tres funciones van con --no-verify-jwt, igual que hoy: el cron y la PWA las llaman sin JWT y
# cada una se protege sola (token de forzar, PIN de administrador).
name: Desplegar funciones
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/funciones.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: funciones
  cancel-in-progress: false
jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROYECTO: zdhkhsrwvvripuczhvam   # central-ingenieria (solo esquema futbol)
    steps:
      - name: ¿Hay token?
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta el secreto SUPABASE_ACCESS_TOKEN: no se despliega nada."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.hay == 'si'
        uses: actions/checkout@v4
      - if: steps.token.outputs.hay == 'si'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.token.outputs.hay == 'si'
        name: Desplegar
        run: |
          for f in escaner api sonda-flashscore; do
            supabase functions deploy "$f" --project-ref "$PROYECTO" --no-verify-jwt --use-api
          done
